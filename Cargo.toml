[package]
name = "scopecap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
libc = "0.2.191"
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
oxideav-core = "0.1.42"
oxideav-mjpeg = "0.1.13"
oxideav-png = { version = "0.1.12", default-features = false }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
